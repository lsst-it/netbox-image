---
# yamllint disable rule:quoted-strings rule:line-length
name: Build

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: docker.io/lsstit/netbox

jobs:
  test:
    name: Build and smoke test (${{ matrix.arch }})
    # Each architecture is built and tested natively (GitHub's arm64 runners are free for public
    # repositories), so the smoke test never runs under emulation.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Throwaway backends for the smoke test only, never part of the image. In the clusters NetBox
    # uses netbox-pg (CNPG, ghcr.io/cloudnative-pg/postgresql:17) and the chart's Valkey subchart
    # (Bitnami, Valkey 9): keep the same major versions here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netbox-image:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Runs like the chart's securityContext: uid 1000, read-only root filesystem, /tmp writable
      # (an emptyDir there), so a plugin that writes into the image at runtime fails here first.
      - name: smoke test (migrate, plugin endpoint, topology page)
        run: |
          docker run --rm --network host --user 1000:1000 --read-only --tmpfs /tmp \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_CACHE_HOST=localhost \
            -e SECRET_KEY=ci-only-dummy-key-ci-only-dummy-key-ci-only-0123456789 \
            -v "$PWD/configuration/plugins.py:/etc/netbox/config/plugins.py:ro" \
            -v "$PWD/tests/smoke.py:/opt/smoke.py:ro" \
            --entrypoint /bin/sh netbox-image:test -c '
              set -e
              uname -m
              cd /opt/netbox/netbox
              /opt/netbox/venv/bin/python manage.py migrate --no-input
              /opt/netbox/venv/bin/python manage.py shell -c "exec(open(\"/opt/smoke.py\").read())"
            '

  push:
    name: Push (linux/amd64, linux/arm64)
    needs: test  # both architectures passed
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # arm64 is built under QEMU here; our layers are only pip installs and collectstatic, and
      # the tested arm64 layers come from the arm64 job's cache.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # git tag v4.7.4-1 -> image v4.7.4-1 (the release); main -> main and sha-<short>
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - uses: docker/login-action@v3
        with:  # lsst-it org secrets, as in cnpg-backup
          username: ${{ secrets.DOCKERHUB_LSSTIT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LSSTIT_PASSWORD }}

      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
