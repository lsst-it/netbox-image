---
# yamllint disable rule:quoted-strings rule:line-length
name: Build

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/lsst-it/netbox

jobs:
  build:
    name: Build, smoke test, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17  # NetBox 4.7 needs PostgreSQL 15 or later
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netbox-image:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test (migrate, plugin endpoint, topology page)
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_CACHE_HOST=localhost \
            -e SECRET_KEY=ci-only-dummy-key-ci-only-dummy-key-ci-only-0123456789 \
            -v "$PWD/configuration/plugins.py:/etc/netbox/config/plugins.py:ro" \
            -v "$PWD/tests/smoke.py:/opt/smoke.py:ro" \
            --entrypoint /bin/sh netbox-image:test -c '
              set -e
              cd /opt/netbox/netbox
              /opt/netbox/venv/bin/python manage.py migrate --no-input
              /opt/netbox/venv/bin/python manage.py shell -c "exec(open(\"/opt/smoke.py\").read())"
            '

      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # git tag v4.7.4-1 -> image v4.7.4-1 (the release); main -> main and sha-<short>
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
